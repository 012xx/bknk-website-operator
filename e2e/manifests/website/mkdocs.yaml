apiVersion: website.zoetrope.github.io/v1beta1
kind: WebSite
metadata:
  name: mkdocs-sample
  namespace: default
spec:
  buildImage: ghcr.io/cybozu-go/website-operator-python:dev
  buildScript:
    configMap:
      name: build-scripts
      key: build-mkdocs.sh
  repoURL: git@github.com:neco-test/mkdocs-sample.git
  branch: main
  deployKeySecretName: mkdocs-deploy-key
  extraResources:
    - configMap:
        name: httpproxy
        key: httpproxy.tmpl
