apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
        - name: manager
          image: ghcr.io/cybozu-go/website-operator:dev
          imagePullPolicy: Never
          args:
            - --repochecker-container-image=ghcr.io/cybozu-go/website-operator-repo-checker:dev
          env:
          - name: NGINX_CONTAINER_IMAGE
            value: ghcr.io/cybozu-go/website-operator-nginx:dev
